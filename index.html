<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NetCmd</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <span class="logo">NetCmd</span>
  <span class="tagline">Find. Fill. Copy.</span>
  <button id="toggle-name" type="button"></button>
</header>

<main>
  <div id="cmd-list"></div>

  <details id="add-box">
    <summary>+ Add command</summary>
    <form id="add-form">
      <label>Name (optional) <input id="add-name" type="text" placeholder="BGP advertised routes" autocomplete="off"></label>
      <label>Template <input id="add-template" type="text" placeholder="display bgp routing-table ipv4 peer {peer} advertised-routes" autocomplete="off"></label>
      <label>Category <select id="add-cat"></select></label>
      <button type="submit">Save</button>
    </form>
  </details>

  <details id="add-cat-box">
    <summary>+ Add category</summary>
    <form id="add-cat-form">
      <label>Name <input id="add-cat-name" type="text" placeholder="Cisco" autocomplete="off"></label>
      <span id="color-swatches"></span>
      <button type="submit">Save</button>
    </form>
  </details>

  <details id="data-box">
    <summary>Data (YAML)</summary>
    <textarea id="yaml-text" rows="16" spellcheck="false"></textarea>
    <div class="data-actions">
      <button type="button" id="yaml-reload">Reload</button>
      <button type="button" id="yaml-download">Export</button>
      <label class="file-label">Import<input type="file" id="yaml-file" accept=".yaml,.yml,.txt"></label>
      <button type="button" id="yaml-replace">Replace all</button>
      <span id="yaml-msg"></span>
    </div>
  </details>
</main>

<footer>Custom commands and categories are stored in your browser's localStorage.</footer>

<script src="app.js"></script>
</body>
</html>
